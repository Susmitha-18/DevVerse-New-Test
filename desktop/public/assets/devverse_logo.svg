<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect width="256" height="256" rx="56" fill="#0b0c11"/>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Outer glowing orbital ring -->
  <path d="M 50,128 A 78,78 0 1,1 206,128" fill="none" stroke="url(#cyanGrad)" stroke-width="16" stroke-linecap="round"/>
  
  <!-- Inner vibrant arc -->
  <path d="M 128,202 A 74,74 0 0,1 54,128" fill="none" stroke="url(#purpleGrad)" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Center Atom / Node -->
  <circle cx="128" cy="128" r="22" fill="#38bdf8"/>
  <circle cx="128" cy="128" r="10" fill="#ffffff"/>
  
  <!-- Orbiting Satellites -->
  <circle cx="206" cy="128" r="10" fill="#38bdf8"/>
  <circle cx="50" cy="128" r="8" fill="#a855f7"/>
  
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
</svg>